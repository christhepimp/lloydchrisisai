name: Build Lloyd APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "interface/mobile_web/**"
      - "mobile/**"
      - "package.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Init Capacitor Android project
        run: |
          npx cap init "Lloyd" "ai.lloyd.chris" --web-dir interface/mobile_web
          cp mobile/capacitor.config.json capacitor.config.json || true
          npx cap add android
          npx cap sync android

      - name: Android permissions — camera, mic, cleartext
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          XML
          sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" /' "$MANIFEST"
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.camera' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
          fi
          if ! grep -q 'android.hardware.microphone' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.microphone" android:required="false" />' "$MANIFEST"
          fi
          echo "=== Manifest permissions ==="
          grep -E 'uses-permission|uses-feature|usesCleartextTraffic|networkSecurityConfig' "$MANIFEST" || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lloyd-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
