name: Build Lloyd APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "interface/mobile_web/**"
      - "mobile/**"
      - "package.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Init Capacitor Android project
        run: |
          npx cap init "Lloyd" "ai.lloyd.chris" --web-dir interface/mobile_web
          cp mobile/capacitor.config.json capacitor.config.json || true
          npx cap add android
          npx cap sync android

      - name: Allow cleartext HTTP (Termux local IP)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/xml/network_security_config.xml
          echo '<network-security-config>' >> android/app/src/main/res/xml/network_security_config.xml
          echo '  <base-config cleartextTrafficPermitted="true" />' >> android/app/src/main/res/xml/network_security_config.xml
          echo '</network-security-config>' >> android/app/src/main/res/xml/network_security_config.xml
          sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" /' "$MANIFEST"
          grep -E 'usesCleartextTraffic|networkSecurityConfig' "$MANIFEST" || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lloyd-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
