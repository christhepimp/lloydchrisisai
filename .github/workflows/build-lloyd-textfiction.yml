name: Build Lloyd TextFiction APK

on:
  workflow_dispatch:
  push:
    paths:
      - "textfiction-lloyd/**"
      - ".github/workflows/build-lloyd-textfiction.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Lloyd repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone official TextFiction source
        run: |
          git clone --depth 1 https://github.com/onyxbits/TextFiction.git /tmp/TextFiction

      - name: Create Gradle project
        run: |
          mkdir -p app/src/main/java app/src/main/res app/src/main/assets
          cp -a /tmp/TextFiction/src/de app/src/main/java/
          cp -a /tmp/TextFiction/res/. app/src/main/res/
          cp -a /tmp/TextFiction/assets/. app/src/main/assets/ 2>/dev/null || true

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LloydTextFiction"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.enableJetifier=false
          EOF

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'de.onyxbits.textfiction'
              compileSdk 28
              defaultConfig {
                  applicationId "ai.lloyd.textfiction"
                  minSdk 16
                  targetSdk 28
                  versionCode 12
                  versionName "2.7-lloyd"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'com.android.support:support-v4:28.0.0'
              implementation 'com.android.support:appcompat-v7:28.0.0'
          }
          EOF

      - name: Install LloydAgentApi
        run: |
          mkdir -p app/src/main/java/de/onyxbits/textfiction/lloyd
          cp textfiction-lloyd/src/de/onyxbits/textfiction/lloyd/LloydAgentApi.java \
             app/src/main/java/de/onyxbits/textfiction/lloyd/

      - name: Patch GameActivity for Lloyd API
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/java/de/onyxbits/textfiction/GameActivity.java")
          text = p.read_text(encoding="utf-8", errors="replace")

          if "lloyd.LloydAgentApi" not in text:
              text = text.replace(
                  "import de.onyxbits.textfiction.input.InputProcessor;",
                  "import de.onyxbits.textfiction.input.InputProcessor;\nimport de.onyxbits.textfiction.lloyd.LloydAgentApi;",
              )

          if "lloydApi" not in text:
              text = text.replace(
                  "private ProgressBar loading;",
                  "private ProgressBar loading;\n\n\t/** Lloyd autonomous agent HTTP API (port 8765). */\n\tprivate LloydAgentApi lloydApi;",
              )

          old_end = """\t\tspeaker = new TextToSpeech(this, this);\n\t\tonSharedPreferenceChanged(prefs, \"\");\n\t\tdimSoftButtonsIfPossible();\n\t}"""
          new_end = """\t\tspeaker = new TextToSpeech(this, this);\n\t\tonSharedPreferenceChanged(prefs, \"\");\n\t\tdimSoftButtonsIfPossible();\n\n\t\tlloydApi = new LloydAgentApi(LloydAgentApi.DEFAULT_PORT);\n\t\tfinal GameActivity self = this;\n\t\tlloydApi.setCommandSink(new LloydAgentApi.CommandSink() {\n\t\t\t@Override\n\t\t\tpublic void submitCommand(final String command) {\n\t\t\t\tself.runOnUiThread(new Runnable() {\n\t\t\t\t\t@Override\n\t\t\t\t\tpublic void run() {\n\t\t\t\t\t\tif (command != null && command.length() > 0) {\n\t\t\t\t\t\t\texecuteCommand((command + \"\\n\").toCharArray());\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t});\n\t\t\t}\n\t\t});\n\t\tlloydApi.start();\n\t\tLog.i(\"LloydAgentApi\", \"listening on port \" + LloydAgentApi.DEFAULT_PORT);\n\t}"""
          if "lloydApi.start" not in text:
              if old_end not in text:
                  raise SystemExit("onCreate anchor missing")
              text = text.replace(old_end, new_end, 1)

          old_destroy = """\tpublic void onDestroy() {\n\t\tprefs.unregisterOnSharedPreferenceChangeListener(this);"""
          new_destroy = """\tpublic void onDestroy() {\n\t\tif (lloydApi != null) {\n\t\t\tlloydApi.stop();\n\t\t\tlloydApi = null;\n\t\t}\n\t\tprefs.unregisterOnSharedPreferenceChangeListener(this);"""
          if "lloydApi.stop" not in text:
              if old_destroy not in text:
                  raise SystemExit("onDestroy anchor missing")
              text = text.replace(old_destroy, new_destroy, 1)

          old_pub = """\t\tflipView(showLower);\n\t\tfigurePromptStyle();\n\t\tfigureMenuState();\n\t}\n\n\t/**\n\t * Show the correct prompt.\n\t */\n\tprivate void figurePromptStyle() {"""
          new_pub = """\t\tflipView(showLower);\n\t\tfigurePromptStyle();\n\t\tfigureMenuState();\n\n\t\tif (lloydApi != null && retainerFragment != null && retainerFragment.engine != null) {\n\t\t\tStringBuilder story = new StringBuilder();\n\t\t\ttry {\n\t\t\t\tfor (int i = 0; i < retainerFragment.messageBuffer.size(); i++) {\n\t\t\t\t\tStoryItem item = retainerFragment.messageBuffer.get(i);\n\t\t\t\t\tif (item != null && item.message != null) {\n\t\t\t\t\t\tif (story.length() > 0) story.append(\"\\n\");\n\t\t\t\t\t\tstory.append(item.message.toString());\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t} catch (Exception e) {\n\t\t\t\tLog.w(\"LloydAgentApi\", e);\n\t\t\t}\n\t\t\tboolean waiting = retainerFragment.engine.getRunState() == ZMachine.STATE_WAIT_CMD;\n\t\t\tlloydApi.publishState(story.toString(), retainerFragment.upperWindow, waiting);\n\t\t}\n\t}\n\n\t/**\n\t * Show the correct prompt.\n\t */\n\tprivate void figurePromptStyle() {"""
          if "publishState" not in text:
              if old_pub not in text:
                  raise SystemExit("publishResult anchor missing")
              text = text.replace(old_pub, new_pub, 1)

          p.write_text(text)
          print("GameActivity patched OK")
          PY

      - name: Write AndroidManifest with INTERNET
        run: |
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="de.onyxbits.textfiction">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Nemo"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:label="@string/app_name"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name="de.onyxbits.textfiction.GameActivity"
                      android:label="@string/title_activity_game"
                      android:parentActivityName=".MainActivity"
                      android:windowSoftInputMode="stateAlwaysHidden"
                      android:exported="false">
                      <meta-data
                          android:name="android.support.PARENT_ACTIVITY"
                          android:value=".MainActivity" />
                  </activity>
                  <activity
                      android:name="de.onyxbits.textfiction.SettingActivity"
                      android:theme="@style/AppTheme"
                      android:parentActivityName=".MainActivity"
                      android:label="@string/title_activity_setting"
                      android:exported="false">
                      <meta-data
                          android:name="android.support.PARENT_ACTIVITY"
                          android:value=".MainActivity" />
                  </activity>
              </application>
          </manifest>
          XML

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lloyd-textfiction-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
