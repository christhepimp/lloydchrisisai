<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lloyd</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --accent: #00ff9d;
      --text: #f0f0f0;
      --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 16px;
      background: var(--card);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .title { font-weight: 700; font-size: 1.25rem; letter-spacing: 1px; }
    header .title span { color: var(--accent); }
    .actions { display: flex; gap: 8px; }
    .actions button {
      background: #222;
      border: 1px solid #444;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .actions button:active { background: #333; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2a2a2a;
      border-bottom-right-radius: 4px;
    }
    .lloyd {
      align-self: flex-start;
      background: #132a22;
      border: 1px solid #00ff9d33;
      border-bottom-left-radius: 4px;
    }
    .lloyd::before {
      content: "Lloyd";
      display: block;
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .system {
      align-self: center;
      background: #222;
      color: var(--muted);
      font-size: 0.8rem;
      border-radius: 12px;
      padding: 8px 14px;
    }
    footer {
      padding: 12px;
      background: var(--card);
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 12px 18px;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="title">L<span>oyd</span></div>
    <div class="actions">
      <button id="uploadBtn">Upload</button>
      <button id="trainBtn">Train</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="input" type="text" placeholder="say something..." autocomplete="off" />
    <button id="send">↑</button>
  </footer>

  <input type="file" id="fileInput" accept=".txt,text/plain" />

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const uploadBtn = document.getElementById("uploadBtn");
    const trainBtn = document.getElementById("trainBtn");
    const fileInput = document.getElementById("fileInput");

    const API = window.location.origin; // same origin when served by server.py

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage(data.reply || "...", "lloyd");
      } catch (e) {
        addMessage("(server not running — open via python server.py)", "system");
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });

    // Upload
    uploadBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const form = new FormData();
      form.append("file", file);

      addMessage("uploading " + file.name + "...", "system");

      try {
        const res = await fetch(API + "/upload", {
          method: "POST",
          body: form
        });
        const data = await res.json();
        addMessage(data.message || data.error || "uploaded", "system");
      } catch (e) {
        addMessage("upload failed — is the server running?", "system");
      }
      fileInput.value = "";
    });

    // Train
    trainBtn.addEventListener("click", async () => {
      addMessage("training...", "system");
      try {
        const res = await fetch(API + "/train", { method: "POST" });
        const data = await res.json();
        addMessage(data.message || data.error || "done", "system");
      } catch (e) {
        addMessage("train failed — is the server running?", "system");
      }
    });

    // Greeting
    setTimeout(() => addMessage("yo i’m lloyd. upload files + hit train whenever u want", "lloyd"), 300);
  </script>
</body>
</html>
