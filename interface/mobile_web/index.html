<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lloyd</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --accent: #00ff9d;
      --text: #f0f0f0;
      --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 16px;
      background: var(--card);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .title { font-weight: 700; font-size: 1.25rem; letter-spacing: 1px; }
    header .title span { color: var(--accent); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .actions button {
      background: #222;
      border: 1px solid #444;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .actions button:active { background: #333; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2a2a2a;
      border-bottom-right-radius: 4px;
    }
    .lloyd {
      align-self: flex-start;
      background: #132a22;
      border: 1px solid #00ff9d33;
      border-bottom-left-radius: 4px;
    }
    .lloyd::before {
      content: "Lloyd";
      display: block;
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .system {
      align-self: center;
      background: #222;
      color: var(--muted);
      font-size: 0.8rem;
      border-radius: 12px;
      padding: 8px 14px;
    }
    footer {
      padding: 12px;
      background: var(--card);
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 12px 18px;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    #fileInput, #brainInput { display: none; }

    /* Settings panel */
    #settings {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 24px;
      flex-direction: column;
      justify-content: center;
    }
    #settings.open { display: flex; }
    #settings .box {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #333;
    }
    #settings h2 { margin-bottom: 12px; font-size: 1.1rem; }
    #settings p { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
    #settings input {
      width: 100%;
      background: #222;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    #settings .row { display: flex; gap: 8px; }
    #settings .row button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    #saveUrl { background: var(--accent); color: #000; }
    #closeSettings { background: #333; color: white; }
  </style>
</head>
<body>
  <header>
    <div class="title">L<span>oyd</span></div>
    <div class="actions">
      <button id="uploadBtn">Upload</button>
      <button id="trainBtn">Train</button>
      <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
      <button id="settingsBtn">⚙</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <input id="input" type="text" placeholder="say something..." autocomplete="off" />
    <button id="send">↑</button>
  </footer>

  <input type="file" id="fileInput" accept=".txt,text/plain" />
  <input type="file" id="brainInput" accept=".lloyd,application/octet-stream" />

  <div id="settings">
    <div class="box">
      <h2>Lloyd server</h2>
      <p>Paste the URL where Lloyd’s brain is running (e.g. your Render / Railway / local tunnel link). Leave blank to use this device’s origin.</p>
      <input id="serverUrl" type="url" placeholder="https://your-lloyd.onrender.com" />
      <div class="row">
        <button id="saveUrl">Save</button>
        <button id="closeSettings">Close</button>
      </div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // API base URL
    // 1. If baked in at build time (GitHub Actions input) that wins
    // 2. Else localStorage setting from the ⚙ panel
    // 3. Else window.location.origin (works when served by server.py)
    // ------------------------------------------------------------------
    function getAPI() {
      const baked = null; // build may replace the line below
      // const API = "https://...";  ← GitHub Action can inject this
      const saved = localStorage.getItem("lloyd_server_url");
      if (saved && saved.trim()) return saved.trim().replace(/\/$/, "");
      return window.location.origin;
    }
    let API = getAPI();

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const uploadBtn = document.getElementById("uploadBtn");
    const trainBtn = document.getElementById("trainBtn");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const settingsBtn = document.getElementById("settingsBtn");
    const fileInput = document.getElementById("fileInput");
    const brainInput = document.getElementById("brainInput");
    const settings = document.getElementById("settings");
    const serverUrlInput = document.getElementById("serverUrl");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      try {
        const res = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage(data.reply || "...", "lloyd");
      } catch (e) {
        addMessage("can't reach Lloyd — open ⚙ and set your server URL", "system");
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    uploadBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const form = new FormData();
      form.append("file", file);
      addMessage("uploading " + file.name + "...", "system");
      try {
        const res = await fetch(API + "/upload", { method: "POST", body: form });
        const data = await res.json();
        addMessage(data.message || data.error || "uploaded", "system");
      } catch (e) {
        addMessage("upload failed — check server URL in ⚙", "system");
      }
      fileInput.value = "";
    });

    trainBtn.addEventListener("click", async () => {
      addMessage("training...", "system");
      try {
        const res = await fetch(API + "/train", { method: "POST" });
        const data = await res.json();
        addMessage(data.message || data.error || "done", "system");
      } catch (e) {
        addMessage("train failed — check server URL in ⚙", "system");
      }
    });

    exportBtn.addEventListener("click", async () => {
      addMessage("exporting brain...", "system");
      try {
        const res = await fetch(API + "/export");
        if (!res.ok) throw new Error("export failed");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "lloyd_brain.lloyd";
        a.click();
        URL.revokeObjectURL(url);
        addMessage("brain exported — move lloyd_brain.lloyd anywhere", "system");
      } catch (e) {
        addMessage("export failed", "system");
      }
    });

    importBtn.addEventListener("click", () => brainInput.click());
    brainInput.addEventListener("change", async () => {
      const file = brainInput.files[0];
      if (!file) return;
      addMessage("importing brain...", "system");
      try {
        const res = await fetch(API + "/import", {
          method: "POST",
          body: file,
          headers: { "Content-Type": "application/octet-stream" }
        });
        const data = await res.json();
        addMessage(data.message || data.error || "imported", "system");
      } catch (e) {
        addMessage("import failed", "system");
      }
      brainInput.value = "";
    });

    // Settings
    settingsBtn.addEventListener("click", () => {
      serverUrlInput.value = localStorage.getItem("lloyd_server_url") || "";
      settings.classList.add("open");
    });
    document.getElementById("closeSettings").addEventListener("click", () => {
      settings.classList.remove("open");
    });
    document.getElementById("saveUrl").addEventListener("click", () => {
      const v = serverUrlInput.value.trim().replace(/\/$/, "");
      if (v) localStorage.setItem("lloyd_server_url", v);
      else localStorage.removeItem("lloyd_server_url");
      API = getAPI();
      settings.classList.remove("open");
      addMessage("server set to: " + API, "system");
    });

    setTimeout(() => {
      addMessage("yo i’m lloyd. set your server in ⚙ if needed, then upload + train. export my brain anytime to move me", "lloyd");
    }, 300);
  </script>
</body>
</html>
